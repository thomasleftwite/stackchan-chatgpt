[platformio]
default_envs = atoms3r

[env:atoms3r]
platform = espressif32@6.11.0
board = m5stack-atoms3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_MAX_DATA_SIZE=131072
    -DARDUINOJSON_STRING_LENGTH_SIZE=4
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.2
    https://github.com/tobozo/YAMLDuino.git#bc40a8e080eb1f69b02a772b2bb90bff2f1da0b6
; WebSockets selects WiFi headers using macros declared inside its headers.
lib_ldf_mode = deep
extra_scripts = pre:tools/prepare_websockets.py
